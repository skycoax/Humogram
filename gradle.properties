## Project-wide Gradle settings.
#
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx10248m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
#Sat Mar 12 05:53:50 MSK 2016
APP_VERSION_CODE=6994
APP_VERSION_NAME=1.0.1
APP_PACKAGE=uz.humogram.app
IS_PRIVATE=false
# Signing credentials are NOT kept here. This file is tracked in a public
# repository, and git history is permanent: a password committed once stays
# readable even after it is removed. The keystore is gitignored, so a leaked
# password alone does not hand over the signing key -- but the two together are
# this app's identity, and for a security product distributed outside a store
# that is the one thing a user has to go on. Anyone holding both can ship a
# signed "SkySecure update".
#
# The real values live in GRADLE_USER_HOME/gradle.properties (D:\gradle-home on
# the build machine), which is outside every repository. Properties set there
# override the placeholders below, so the build works locally and a clone gets
# nothing usable.
#
# On a new machine: copy keystore.properties.example, or set the values in
# GRADLE_USER_HOME/gradle.properties. See gradle/jac-signing.gradle.
RELEASE_KEY_PASSWORD=
RELEASE_KEY_ALIAS=
RELEASE_STORE_PASSWORD=
org.gradle.jvmargs=-Xmx4096M
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=false
# Reuse task outputs across builds, not just within one. Without this, anything
# Gradle cannot prove is up-to-date is redone from scratch -- and switching
# branch or reverting a file invalidates timestamps on work whose inputs never
# actually changed. The cache is keyed on input hashes, so that work comes back
# instead of being repeated. Local only; ~/.gradle/caches/build-cache-1.
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
android.enableR8.fullMode=true
# Humogram: Play requires targetSdk 36 from Aug 31 2026. AGP 8.6.1 builds
# against compileSdk 36 fine but was only "tested up to 35" and says so on
# every build; this is the switch the warning itself asks for.
android.suppressUnsupportedCompileSdk=36

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
