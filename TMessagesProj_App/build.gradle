apply plugin: 'com.android.application'

// SkySecure: release signing from keystore.properties. Removes Gradle's
// silent fallback to the public debug key.
apply from: "$rootDir/../TelegramAPI/client/telegram-integration/gradle/jac-signing.gradle"

repositories {
    mavenCentral()
    google()
}

configurations {
    compile.exclude module: 'support-v4'
}

configurations.all {
    exclude group: 'com.google.firebase', module: 'firebase-core'
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
}

dependencies {
    implementation project(':TMessagesProj')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation files('../TMessagesProj/libs/libgsaverification-client.aar')
}

android {
    compileSdkVersion 36
    buildToolsVersion '35.0.0'

    defaultConfig.applicationId = APP_PACKAGE

    // Humogram: the Google Maps key comes from a Gradle property (put
    // HUMOGRAM_MAPS_API_KEY=... in D:\gradle-home\gradle.properties), never
    // from source. The key that used to be hard-coded in the config manifests
    // was Telegram's own, restricted to their package and certificate, so in
    // Humogram the map stayed blank; a key is ours to create in Google Cloud.
    defaultConfig.manifestPlaceholders = [mapsApiKey: (project.findProperty("HUMOGRAM_MAPS_API_KEY") ?: "")]

    sourceSets.main.jniLibs.srcDirs = ['../TMessagesProj/jni/']

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }

    signingConfigs {
        debug {
            // SkySecure: our own key, not the one committed to the upstream
            // repository with the password "android". Set here rather than via
            // jac-signing.gradle because that file is applied at the top of this
            // one, so anything it assigns is overwritten by the buildTypes block
            // below — the build succeeds and the APK is simply signed with the
            // wrong key, which only reading the certificate out of the finished
            // package reveals.
            storeFile file("C:/Users/user/Documents/skysecure-keys/skysecure-release.jks")
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
        }

        release {
            // SkySecure: our own key, not the one committed to the upstream
            // repository with the password "android". Set here rather than via
            // jac-signing.gradle because that file is applied at the top of this
            // one, so anything it assigns is overwritten by the buildTypes block
            // below — the build succeeds and the APK is simply signed with the
            // wrong key, which only reading the certificate out of the finished
            // package reveals.
            storeFile file("C:/Users/user/Documents/skysecure-keys/skysecure-release.jks")
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            signingConfig signingConfigs.debug
            applicationIdSuffix ".beta"
            minifyEnabled false
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro', '../TMessagesProj/proguard-rules-beta.pro'
            // SkySecure: see the matching comment in TMessagesProj/build.gradle.
            // 'FULL' on a debug build only produces a 93 MB symbol zip nobody
            // uploads, at 13 s per architecture. Release keeps 'FULL'.
            ndk.debugSymbolLevel = 'NONE'
        }

        standalone {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            applicationIdSuffix ".web"
            minifyEnabled true
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'SYMBOL_TABLE'
        }

        release {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'SYMBOL_TABLE'
        }
    }

    sourceSets.debug {
        manifest.srcFile '../TMessagesProj/config/debug/AndroidManifest.xml'
    }

    sourceSets.standalone {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest.xml'
    }

    sourceSets.release {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest.xml'
    }

    flavorDimensions "minApi"

    productFlavors {
        bundleAfat {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
            ext {
                abiVersionCode = 1
            }
            buildConfigField "boolean", "BUNDLE", "true"
        }
        bundleAfat_SDK23 {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
            sourceSets.debug {
                manifest.srcFile '../TMessagesProj/config/debug/AndroidManifest_SDK23.xml'
            }
            sourceSets.release {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_SDK23.xml'
            }
            minSdkVersion 23
            ext {
                abiVersionCode = 2
            }
            buildConfigField "boolean", "BUNDLE", "true"
        }
        afat {
            ndk {
                // SkySecure: all four unless -PjacAbi says otherwise.
                // See the comment on jacAbiFilters in the root build.gradle.
                abiFilters(*rootProject.ext.jacAbiFilters())
            }
            sourceSets.debug {
                manifest.srcFile '../TMessagesProj/config/debug/AndroidManifest_SDK23.xml'
            }
            sourceSets.release {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_SDK23.xml'
            }
            sourceSets.standalone {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
            }
            ext {
                abiVersionCode = 9
            }
            buildConfigField "boolean", "BUNDLE", "false"
        }
    }

    defaultConfig.versionCode = Integer.parseInt(APP_VERSION_CODE)

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "app.apk"
            output.versionCodeOverride = defaultConfig.versionCode * 10 + variant.productFlavors.get(0).abiVersionCode
        }
    }

    variantFilter { variant ->
        def names = variant.flavors*.name
        if (variant.buildType.name != "release" && !names.contains("afat")) {
            setIgnore(true)
        }
    }

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 36
        versionName APP_VERSION_NAME
        ndkVersion "27.2.12479018"

        multiDexEnabled true

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        externalNativeBuild {
            cmake {
                version '3.10.2'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-21' // , '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }
    namespace 'org.telegram.messenger.regular'

    lintOptions {
        checkReleaseBuilds false
    }
}

// Humogram: push goes through OUR Firebase project or not at all. The
// google-services.json upstream committed next to this file belongs to
// Telegram's project (tmessages2); applying the plugin to it would bake
// Telegram's google_app_id, API key and OAuth client id into an APK published
// under our package name, and Telegram's servers would still have no way to
// reach it. So the plugin is applied only once the file is ours: it names
// APP_PACKAGE. It must also list every package we build (.beta for debug,
// .web for standalone), or that variant fails with "No matching client found".
// Without the plugin there is no google_app_id resource, FirebaseApp never
// initialises, no push token is registered, and messages arrive only while
// the app is open. Owner steps: docs/push-notifications.md.
def googleServicesJson = file('google-services.json')
if (googleServicesJson.exists() && googleServicesJson.getText('UTF-8').contains("\"${APP_PACKAGE}\"")) {
    apply plugin: 'com.google.gms.google-services'
}
